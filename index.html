<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatwoot Course — ٧ أيام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;700;800&display=swap">
<style>
:root{--navy:#27374D;--mid:#526D82;--sky:#9DB2BF;--ice:#DDE6ED;--out:#DDE6ED;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#18222E}}
:root[data-theme="dark"]{--out:#18222E}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box;margin:0}
body{background:var(--out);font-family:'Tajawal',sans-serif;color:var(--ice)}
.page{container-type:inline-size;width:min(100%,680px);margin:0 auto;padding:12px 10px 40px}
.frame{background:var(--navy);border-radius:7cqw;padding:7cqw 6cqw;margin-bottom:5cqw;position:relative;overflow:hidden}
.big{font-family:'Rakkas',serif;line-height:1.1}
.top{display:flex;justify-content:space-between;font-size:3.2cqw;font-weight:700;color:var(--sky)}
.card{background:var(--ice);color:var(--navy);border-radius:4cqw;position:relative;padding:4.5cqw 4.5cqw 4cqw}
.card h3{font-weight:800;font-size:4.6cqw;line-height:1.3}
.card p{font-size:3.7cqw;line-height:1.6;margin-top:1cqw;color:var(--mid);font-weight:500}
.star{position:absolute;top:-3.4cqw;right:5cqw;color:var(--sky);font-size:5cqw;animation:tw 2.4s ease-in-out infinite}
.note{background:var(--ice);background-image:linear-gradient(rgba(157,178,191,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(157,178,191,.55) 1px,transparent 1px);background-size:4cqw 4cqw;color:var(--navy);font-family:'Aref Ruqaa',serif;font-weight:700;text-align:center;padding:6cqw 5cqw;position:relative;line-height:1.75;font-size:5.2cqw;box-shadow:0 .8cqw 2cqw rgba(0,0,0,.3)}
.tape{position:absolute;width:15cqw;height:5.5cqw;background:var(--sky);opacity:.95;animation:wig 3s ease-in-out infinite}
.t1{top:-2.6cqw;left:-4cqw;transform:rotate(-30deg)}.t2{bottom:-2.6cqw;right:-4cqw;transform:rotate(-30deg)}
.row{display:flex;gap:3cqw;margin-top:9cqw}.row .card{flex:1;padding:4.5cqw 2.5cqw;text-align:center}.row .card p{font-size:3.2cqw}
.cta{display:block;margin-top:6cqw;text-align:center;background:var(--sky);color:var(--navy);font-weight:800;font-size:5cqw;padding:4cqw;border-radius:4cqw;text-decoration:none;animation:pulse 2s ease-in-out infinite}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 0 5cqw;background:var(--mid);border-radius:5cqw;padding:2.6cqw 3cqw 3.4cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25)}
nav .l{display:flex;justify-content:space-between;gap:1cqw}
nav a{flex:1;text-align:center;color:var(--ice);font-family:'Rakkas',serif;font-size:5.2cqw;text-decoration:none;padding:1.2cqw 0;border-radius:3cqw;transition:.25s}
nav a.on{background:var(--ice);color:var(--navy);transform:translateY(-.6cqw) scale(1.08)}
nav .bar{height:1cqw;background:var(--navy);border-radius:1cqw;margin-top:2cqw;overflow:hidden}
nav .bar b{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--ice);border-radius:1cqw}
.dh{display:flex;align-items:center;gap:4cqw;margin-bottom:6cqw}
.dn{flex:none;width:19cqw;height:19cqw;border-radius:50%;background:var(--ice);color:var(--navy);display:grid;place-items:center;font-size:12cqw;font-family:'Rakkas',serif}
.dh small{color:var(--sky);font-weight:700;font-size:3.8cqw}
.dh h2{font-family:'Rakkas',serif;font-weight:400;font-size:8.4cqw;line-height:1.2;color:var(--ice)}
.cards{display:flex;flex-direction:column;gap:6cqw;margin:8cqw 0 6cqw}
.ex{background:var(--mid);border:.5cqw dashed var(--sky);border-radius:4cqw;padding:4.5cqw;font-size:4cqw;line-height:1.7;font-weight:700}
.dg{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2.4cqw;margin:6cqw 0;padding:5cqw 3cqw;background:rgba(157,178,191,.14);border-radius:5cqw}
.ch{background:var(--sky);color:var(--navy);font-weight:800;font-size:3.8cqw;padding:2.6cqw 3.4cqw;border-radius:3.5cqw;opacity:0}
.dg i{font-style:normal;color:var(--sky);font-size:5cqw;opacity:0}
.dg.in .ch{animation:pop .5s calc(var(--i)*.2s) both}
.dg.in i{animation:nudge 1.3s calc(var(--i)*.2s + .4s) infinite;opacity:1}
.pr{background:var(--ice);color:var(--navy);border-radius:4cqw;padding:4.2cqw 4.5cqw;font-weight:800;font-size:4cqw;line-height:1.6}
.r{opacity:0;transform:translateY(5cqw) rotate(-1.2deg);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1.25)}
.r.in{opacity:1;transform:none}
.hero svg{display:block;width:62cqw;margin:2cqw auto 0}
.hero .brain{transform-origin:108px 78px;animation:pulse 2.2s ease-in-out infinite}
.hero .bub{animation:bob 3s ease-in-out infinite}
.hero .big{animation:bob 4s ease-in-out infinite}
.tag{display:inline-block;background:var(--ice);color:var(--navy);font-weight:800;font-size:5.6cqw;line-height:1.3;padding:3.5cqw 5cqw;border-radius:4cqw;transform:rotate(-4deg);margin:-6cqw 0 6cqw;animation:wig 3.5s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.35) rotate(25deg);opacity:.7}}
@keyframes wig{50%{rotate:4deg}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes bob{50%{transform:translateY(-1.6cqw)}}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes nudge{50%{transform:translateX(-1.2cqw)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.r{opacity:1!important;transform:none!important}.ch,.dg i{opacity:1!important}}
.card p b{color:var(--navy);font-weight:800}.card p{margin-top:1.4cqw}
.sb{max-width:62cqw;margin:0 auto 7cqw;background:var(--ice);border-radius:5cqw;padding:3cqw;color:var(--navy);font-weight:800;font-size:4cqw;direction:ltr;text-align:left}
.sb div{padding:2cqw 3cqw;border-radius:3cqw}
.sb.in div{animation:hl 8s infinite;animation-delay:calc(var(--i)*1s)}
@keyframes hl{0%,12%{background:var(--navy);color:var(--ice)}13%,100%{background:none}}
.dg{display:block;position:relative;aspect-ratio:1000/580;margin:6cqw -2cqw;padding:0;overflow:hidden;border-radius:5cqw;background:repeating-radial-gradient(circle at 0% 100%,transparent 0 7cqw,rgba(221,230,237,.07) 7cqw 7.3cqw),linear-gradient(150deg,var(--mid),var(--navy))}
.dg svg{position:absolute;inset:0;width:100%;height:100%}
.dg path{fill:none;stroke:var(--ice);stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.75;stroke-dasharray:1;stroke-dashoffset:1}
.dg.in path{animation:draw 2.4s ease forwards}
.dot{position:absolute;width:2.6cqw;height:2.6cqw;margin:-1.3cqw 0 0 -1.3cqw;border-radius:50%;background:var(--ice);box-shadow:0 0 0 1.1cqw rgba(221,230,237,.2);opacity:0}
.dg.in .dot{animation:pop .5s calc(var(--i)*.35s + .3s) both}
.cap{position:absolute;opacity:0;color:var(--ice)}
.cap{width:17cqw;text-align:center;font-weight:300;line-height:1.5;transform:translate(-50%,0);margin-top:2.8cqw}
.cap b{display:block;font-weight:800;font-size:5.2cqw;line-height:1.1}
.cap small{display:block;font-size:2.2cqw;opacity:.7;margin:.4cqw 0 1.2cqw}
.dg.in .cap{animation:fin .7s calc(var(--i)*.35s + .5s) both}
.sp{position:absolute;color:var(--ice);font-size:3.4cqw;animation:tw 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fin{from{opacity:0;translate:0 2cqw}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.dg path{stroke-dashoffset:0}.dot,.cap,.num{opacity:1!important}}
</style>
</head>
